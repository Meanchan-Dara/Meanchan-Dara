name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs every day
  workflow_dispatch:       # allows manual run
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ https://raw.githubusercontent.com/Meanchan-Dara/Meanchan-Dara/output/github-snake.svg }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#059669&color_dots=#ecfdf5,#a7f3d0,#6ee7b7,#34d399,#10b981
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#34d399

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
